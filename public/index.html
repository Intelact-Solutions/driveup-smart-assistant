<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveUp Smart Assistant</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --user-bubble: #2563eb;
      --bot-bubble: #f9fafb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    #new-chat {
      margin-left: auto;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    #new-chat:hover { background: var(--bg); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; }
    .msg.bot { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--border); white-space: normal; }
    .msg.bot p { margin: 0 0 8px; }
    .msg.bot p:last-child { margin-bottom: 0; }
    .msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 20px; }
    .msg.bot li { margin: 2px 0; }
    .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4 { font-size: 15px; margin: 10px 0 4px; }
    .msg.bot strong { font-weight: 600; }
    .msg.bot em { font-style: italic; }
    .msg.bot code { background: #f3f4f6; border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; font-size: 12px; }
    .msg.bot pre { background: #f3f4f6; border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 8px 0; }
    .msg.bot pre code { background: none; border: none; padding: 0; font-size: 12px; }
    .msg.bot a { color: var(--accent); }
    .msg.bot blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .msg.bot table { border-collapse: collapse; margin: 8px 0; }
    .msg.bot th, .msg.bot td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .msg.bot hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .msg.error { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    #input-row {
      padding: 14px 20px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    #question {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    #question:focus { border-color: var(--accent); }
    #send {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>DriveUp Smart Assistant</h1>
    <button id="new-chat" title="Start a new conversation">New chat</button>
  </header>
  <div id="messages"></div>
  <div id="input-row">
    <input id="question" type="text" placeholder="Ask about DriveUp, e.g. How does company onboarding work?" autocomplete="off" />
    <button id="send">Ask</button>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const newChatBtn = document.getElementById('new-chat');
    const STORAGE_KEY = 'du-chat-id';
    let conversationId = localStorage.getItem(STORAGE_KEY);

    newChatBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      conversationId = null;
      messages.innerHTML = '';
      input.focus();
    });

    function renderMarkdown(text) {
      if (!window.marked) return text;
      const raw = window.marked.parse(text);
      return window.DOMPurify ? window.DOMPurify.sanitize(raw) : raw;
    }

    function addMessage(text, kind) {
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      if (kind === 'bot') {
        el.innerHTML = renderMarkdown(text);
      } else {
        el.textContent = text;
      }
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    function addTyping() {
      const el = document.createElement('div');
      el.className = 'msg bot hint';
      el.textContent = 'Thinking\u2026';
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    async function ask() {
      const question = input.value.trim();
      if (!question || sendBtn.disabled) return;
      input.value = '';
      addMessage(question, 'user');
      sendBtn.disabled = true;
      const typing = addTyping();
      try {
        const res = await fetch('/chatbot/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, conversationId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        if (data.conversationId) {
          conversationId = data.conversationId;
          localStorage.setItem(STORAGE_KEY, conversationId);
        }
        typing.remove();
        addMessage(data.answer, 'bot');
      } catch (err) {
        typing.remove();
        addMessage('Error: ' + err.message, 'error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', ask);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
    input.focus();
  </script>
</body>
</html>
