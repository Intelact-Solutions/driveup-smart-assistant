<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DriveUp Smart Assistant</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --user-bubble: #2563eb;
      --bot-bubble: #f9fafb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    #language-select {
      margin-left: auto;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    #language-select:focus { outline: none; border-color: var(--accent); }
    #new-chat {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }
    #new-chat:hover { background: var(--bg); }
    #main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #chat-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 14px;
    }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; }
    .msg.bot { align-self: flex-start; background: var(--bot-bubble); border: 1px solid var(--border); white-space: normal; }
    .msg.bot p { margin: 0 0 8px; }
    .msg.bot p:last-child { margin-bottom: 0; }
    .msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 20px; }
    .msg.bot li { margin: 2px 0; }
    .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4 { font-size: 15px; margin: 10px 0 4px; }
    .msg.bot strong { font-weight: 600; }
    .msg.bot em { font-style: italic; }
    .msg.bot code { background: #f3f4f6; border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; font-size: 12px; }
    .msg.bot pre { background: #f3f4f6; border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow-x: auto; margin: 8px 0; }
    .msg.bot pre code { background: none; border: none; padding: 0; font-size: 12px; }
    .msg.bot a { color: var(--accent); }
    .msg.bot blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--border); color: var(--muted); }
    .msg.bot table { border-collapse: collapse; margin: 8px 0; }
    .msg.bot th, .msg.bot td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
    .msg.bot hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .msg.error { align-self: flex-start; background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    #input-row {
      padding: 14px 20px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    #question {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }
    #question:focus { border-color: var(--accent); }
    #send {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    #questions {
      width: 300px;
      border-left: 1px solid var(--border);
      background: var(--panel);
      overflow-y: auto;
      padding: 16px;
    }
    #questions h2 {
      font-size: 12px;
      margin: 0 0 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #use-case-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #use-case-list li {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
      color: var(--text);
      background: var(--bot-bubble);
    }
    #use-case-list li:hover { border-color: var(--accent); color: var(--accent); }
    #lang-modal {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #lang-modal.hidden { display: none; }
    .lang-card {
      background: var(--panel);
      border-radius: 14px;
      padding: 24px;
      width: min(360px, 90vw);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .lang-card h2 { margin: 0 0 16px; font-size: 18px; }
    .lang-card button {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    .lang-card button:hover { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 900px) {
      #questions { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="header-title">DriveUp Smart Assistant</h1>
    <select id="language-select" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="it">Italiano</option>
    </select>
    <button id="new-chat" title="Start a new conversation">New chat</button>
  </header>
  <div id="main">
    <div id="chat-col">
      <div id="messages"></div>
      <div id="input-row">
        <input id="question" type="text" placeholder="Ask about DriveUp, e.g. How does company onboarding work?" autocomplete="off" />
        <button id="send">Ask</button>
      </div>
    </div>
    <aside id="questions">
      <h2 id="sidebar-title">Most important use cases</h2>
      <ul id="use-case-list"></ul>
    </aside>
  </div>
  <div id="lang-modal">
    <div class="lang-card">
      <h2 id="lang-modal-title">Select your language</h2>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="de">Deutsch</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="it">Italiano</button>
    </div>
  </div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const newChatBtn = document.getElementById('new-chat');
    const languageSelect = document.getElementById('language-select');
    const headerTitle = document.getElementById('header-title');
    const sidebarTitle = document.getElementById('sidebar-title');
    const useCaseList = document.getElementById('use-case-list');
    const langModal = document.getElementById('lang-modal');
    const langModalTitle = document.getElementById('lang-modal-title');
    const STORAGE_KEY = 'du-chat-id';
    const LANG_STORAGE_KEY = 'du-chat-lang';
    const SUPPORTED_LANGS = ['en', 'de', 'fr', 'it'];

    const UI_STRINGS = {
      en: {
        title: 'DriveUp Smart Assistant',
        newChat: 'New chat',
        newChatTitle: 'Start a new conversation',
        placeholder: 'Ask about DriveUp, e.g. How does company onboarding work?',
        ask: 'Ask',
        thinking: 'Thinking\u2026',
        sidebarTitle: 'Most important use cases',
        modalTitle: 'Select your language',
        errorPrefix: 'Error: ',
      },
      de: {
        title: 'DriveUp Smart Assistent',
        newChat: 'Neuer Chat',
        newChatTitle: 'Eine neue Unterhaltung starten',
        placeholder: 'Fragen Sie etwas zu DriveUp, z. B. Wie funktioniert das Onboarding eines Unternehmens?',
        ask: 'Fragen',
        thinking: 'Denkt nach\u2026',
        sidebarTitle: 'Wichtigste Anwendungsf\u00e4lle',
        modalTitle: 'W\u00e4hlen Sie Ihre Sprache',
        errorPrefix: 'Fehler: ',
      },
      fr: {
        title: 'Assistant intelligent DriveUp',
        newChat: 'Nouvelle conversation',
        newChatTitle: 'D\u00e9marrer une nouvelle conversation',
        placeholder: 'Posez une question sur DriveUp, p. ex. Comment fonctionne l\u2019int\u00e9gration d\u2019une entreprise ?',
        ask: 'Envoyer',
        thinking: 'R\u00e9flexion\u2026',
        sidebarTitle: 'Cas d\u2019utilisation les plus importants',
        modalTitle: 'Choisissez votre langue',
        errorPrefix: 'Erreur : ',
      },
      it: {
        title: 'Assistente intelligente DriveUp',
        newChat: 'Nuova conversazione',
        newChatTitle: 'Avvia una nuova conversazione',
        placeholder: 'Chiedi qualcosa su DriveUp, ad es. Come funziona l\u2019onboarding di un\u2019azienda?',
        ask: 'Chiedi',
        thinking: 'Sto pensando\u2026',
        sidebarTitle: 'Casi d\u2019uso pi\u00f9 importanti',
        modalTitle: 'Scegli la tua lingua',
        errorPrefix: 'Errore: ',
      },
    };

    let conversationId = localStorage.getItem(STORAGE_KEY);

    let storedLang = localStorage.getItem(LANG_STORAGE_KEY);
    let currentLang = SUPPORTED_LANGS.includes(storedLang) ? storedLang : 'en';

    let useCases = { en: [], de: [], fr: [], it: [] };

    function applyLang(lang) {
      currentLang = lang;
      const s = UI_STRINGS[lang];
      document.title = s.title;
      headerTitle.textContent = s.title;
      newChatBtn.textContent = s.newChat;
      newChatBtn.title = s.newChatTitle;
      input.placeholder = s.placeholder;
      sendBtn.textContent = s.ask;
      sidebarTitle.textContent = s.sidebarTitle;
      langModalTitle.textContent = s.modalTitle;
      languageSelect.value = lang;
      renderUseCases();
    }

    function renderUseCases() {
      const items = useCases[currentLang] || [];
      useCaseList.innerHTML = '';
      for (const q of items) {
        const li = document.createElement('li');
        li.textContent = q;
        li.addEventListener('click', () => {
          input.value = q;
          ask();
        });
        useCaseList.appendChild(li);
      }
    }

    newChatBtn.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      conversationId = null;
      messages.innerHTML = '';
      input.focus();
    });

    languageSelect.addEventListener('change', () => {
      applyLang(languageSelect.value);
      localStorage.setItem(LANG_STORAGE_KEY, languageSelect.value);
    });

    langModal.querySelectorAll('.lang-card button').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyLang(btn.dataset.lang);
        localStorage.setItem(LANG_STORAGE_KEY, btn.dataset.lang);
        langModal.classList.add('hidden');
        input.focus();
      });
    });

    fetch('/use-cases.json')
      .then((res) => res.json())
      .then((data) => {
        useCases = data;
        renderUseCases();
      })
      .catch(() => {});

    applyLang(currentLang);

    if (!SUPPORTED_LANGS.includes(localStorage.getItem(LANG_STORAGE_KEY))) {
      langModal.classList.remove('hidden');
      input.blur();
    } else {
      input.focus();
    }

    function renderMarkdown(text) {
      if (!window.marked) return text;
      const raw = window.marked.parse(text);
      return window.DOMPurify ? window.DOMPurify.sanitize(raw) : raw;
    }

    function addMessage(text, kind) {
      const el = document.createElement('div');
      el.className = 'msg ' + kind;
      if (kind === 'bot') {
        el.innerHTML = renderMarkdown(text);
      } else {
        el.textContent = text;
      }
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    function addTyping() {
      const el = document.createElement('div');
      el.className = 'msg bot hint';
      el.textContent = UI_STRINGS[currentLang].thinking;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    async function ask() {
      const question = input.value.trim();
      if (!question || sendBtn.disabled) return;
      input.value = '';
      addMessage(question, 'user');
      sendBtn.disabled = true;
      const typing = addTyping();
      try {
        const res = await fetch('/chatbot/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, conversationId }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        if (data.conversationId) {
          conversationId = data.conversationId;
          localStorage.setItem(STORAGE_KEY, conversationId);
        }
        typing.remove();
        addMessage(data.answer, 'bot');
      } catch (err) {
        typing.remove();
        addMessage(UI_STRINGS[currentLang].errorPrefix + err.message, 'error');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', ask);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
  </script>
</body>
</html>
